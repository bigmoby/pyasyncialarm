default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black
        args:
          - --line-length=88
          - --preview
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [--strict]
        language: python
        language_version: python3.14
        additional_dependencies:
          - "pydantic>=2.0.0"
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        files: ^tests/.*\.py$
        additional_dependencies:
          - pytest
          - pytest-asyncio
          - dicttoxml2
          - xmltodict
        args:
          - tests/test_pyasyncialarm.py
          - -v
